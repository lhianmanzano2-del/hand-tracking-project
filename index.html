<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hand Tracking</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        h1 {
            margin: 20px 0 10px;
        }

        #status {
            margin-bottom: 15px;
        }

        .camera-container {
            position: relative;
            width: min(90vw, 900px);
            margin: auto;
        }

        video {
            width: 100%;
            display: block;
            transform: scaleX(-1);
            border-radius: 10px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }

        button {
            margin: 20px 5px;
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <h1>🖐️ Hand Tracking</h1>

    <p id="status">Click "Start Camera"</p>

    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <button id="startButton">Start Camera</button>

    <script type="module">

        import {
            FilesetResolver,
            HandLandmarker
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";

        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const status = document.getElementById("status");
        const startButton = document.getElementById("startButton");

        let handLandmarker;
        let lastVideoTime = -1;

        async function createHandLandmarker() {

            status.textContent = "Loading hand tracking...";

            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
            );

            handLandmarker = await HandLandmarker.createFromOptions(
                vision,
                {
                    baseOptions: {
                        modelAssetPath:
                            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
                    },

                    runningMode: "VIDEO",

                    numHands: 2,

                    minHandDetectionConfidence: 0.5,

                    minHandPresenceConfidence: 0.5,

                    minTrackingConfidence: 0.5
                }
            );

            status.textContent = "Hand tracking is ready!";
        }

        async function startCamera() {

            try {

                status.textContent = "Requesting camera permission...";

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: true
                });

                video.srcObject = stream;

                await video.play();

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                status.textContent = "Camera started. Show your hand!";

                detectHands();

            } catch (error) {

                console.error(error);

                status.textContent =
                    "Camera permission was denied or unavailable.";
            }
        }

        function drawHand(landmarks) {

            const connections = [
                [0, 1],
                [1, 2],
                [2, 3],
                [3, 4],

                [0, 5],
                [5, 6],
                [6, 7],
                [7, 8],

                [5, 9],
                [9, 10],
                [10, 11],
                [11, 12],

                [9, 13],
                [13, 14],
                [14, 15],
                [15, 16],

                [13, 17],
                [17, 18],
                [18, 19],
                [19, 20],

                [0, 17]
            ];

            // Draw connections
            ctx.strokeStyle = "#00ff00";
            ctx.lineWidth = 4;

            for (const connection of connections) {

                const start = landmarks[connection[0]];
                const end = landmarks[connection[1]];

                ctx.beginPath();

                ctx.moveTo(
                    start.x * canvas.width,
                    start.y * canvas.height
                );

                ctx.lineTo(
                    end.x * canvas.width,
                    end.y * canvas.height
                );

                ctx.stroke();
            }

            // Draw landmarks
            ctx.fillStyle = "#ff0000";

            for (const point of landmarks) {

                const x = point.x * canvas.width;
                const y = point.y * canvas.height;

                ctx.beginPath();

                ctx.arc(x, y, 6, 0, Math.PI * 2);

                ctx.fill();
            }
        }

        function detectHands() {

            if (!handLandmarker) {
                requestAnimationFrame(detectHands);
                return;
            }

            if (video.readyState >= 2) {

                if (video.currentTime !== lastVideoTime) {

                    lastVideoTime = video.currentTime;

                    const results =
                        handLandmarker.detectForVideo(
                            video,
                            performance.now()
                        );

                    ctx.clearRect(
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );

                    if (results.landmarks) {

                        for (const landmarks of results.landmarks) {

                            drawHand(landmarks);
                        }
                    }
                }
            }

            requestAnimationFrame(detectHands);
        }

        startButton.addEventListener(
            "click",
            startCamera
        );

        createHandLandmarker();

    </script>

</body>
</html>
